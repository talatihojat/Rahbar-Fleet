
name: Build Rahbar APKs

on:
  workflow_dispatch:
  push:
    paths:
      - 'Rahbar_Android_Project.zip'
      - '.github/workflows/build-from-archive.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: unzip -o Rahbar_Android_Project.zip -d .

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build both APKs
        run: gradle --no-daemon assembleFleetDebug assembleDriversDebug

      - name: Upload APK files
        uses: actions/upload-artifact@v4
        with:
          name: rahbar-android-apks
          path: |
            app/build/outputs/apk/fleet/debug/*.apk
            app/build/outputs/apk/drivers/debug/*.apk
